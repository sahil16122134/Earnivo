<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnivo — Earn real rewards</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components/modal.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/components/ad-slot.css">
<style>
  body{padding-bottom:0}
  .landing{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-6);text-align:center}
  .landing-mark{font-family:var(--font-display);font-weight:700;font-size:1.6rem;margin-bottom:var(--space-2)}
  .landing-mark span{color:var(--accent-amber)}
  .landing h1{font-size:1.5rem;max-width:340px;margin:var(--space-4) 0 var(--space-2)}
  .landing p{color:var(--text-muted);font-size:.9rem;max-width:320px;margin-bottom:var(--space-6)}

  .auth-card{width:100%;max-width:320px;text-align:left}
  .auth-tabs{display:flex;background:var(--surface-2);border-radius:var(--radius-pill);padding:4px;margin-bottom:var(--space-4)}
  .auth-tab{flex:1;border:none;background:transparent;padding:8px 0;border-radius:var(--radius-pill);font-family:var(--font-body);font-weight:600;font-size:.82rem;color:var(--text-muted);cursor:pointer;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
  .auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  .field{margin-bottom:var(--space-3)}
  .field label{display:block;font-size:.76rem;font-weight:600;color:var(--text-muted);margin-bottom:6px}
  .field input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-body);font-size:.9rem}
  .field input:focus{outline:2px solid var(--accent-amber);outline-offset:-1px}

  .auth-error{display:none;background:rgba(240,87,107,.1);border:1px solid rgba(240,87,107,.3);color:var(--accent-coral-ink);border-radius:var(--radius-sm);padding:10px 12px;font-size:.8rem;margin-bottom:var(--space-3)}
  [data-theme="dark"] .auth-error,body:not([data-theme="light"]) .auth-error{color:var(--accent-coral)}

  .auth-divider{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-4) 0;color:var(--text-faint);font-size:.76rem}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border)}

  .btn-google{display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-google svg{width:18px;height:18px;flex-shrink:0}

  .landing .fine{font-size:.72rem;color:var(--text-faint);margin-top:var(--space-6);max-width:280px}
  .landing .fine a{text-decoration:underline}
</style>
</head>
<body>
<div class="landing">
  <div class="landing-mark">Earn<span>ivo</span></div>
  <h1>Complete tasks. Earn real rewards.</h1>
  <p>Surveys, offers, ads and referrals — track everything and withdraw when you're ready.</p>

  <div class="auth-card">
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Log in</button>
      <button type="button" class="auth-tab" id="tab-signup">Sign up</button>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
    </form>

    <div class="auth-divider">or</div>

    <button type="button" class="btn btn-secondary btn-block btn-google" id="google-signin">
      <svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A8.98 8.98 0 0 0 9 0 9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
      Continue with Google
    </button>
  </div>

  <p class="fine">By continuing, you agree to our <a href="pages/legal/terms.html">Terms</a> and <a href="pages/legal/privacy.html">Privacy Policy</a>.</p>
</div>
<script type="module" src="js/pages/index.js"></script>
</body>
</html>
