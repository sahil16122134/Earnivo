<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnivo Admin — Revenue</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/toast.css">
<link rel="stylesheet" href="../css/components/ad-slot.css">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="admin-sidebar"></nav>
  <div>
    <header class="admin-topbar"><div><strong>Revenue</strong></div>
      <div class="chip-row" id="range-chips">
        <button class="chip" data-r="today">Today</button>
        <button class="chip active" data-r="7d">7D</button>
        <button class="chip" data-r="30d">30D</button>
        <button class="chip" data-r="90d">90D</button>
      </div>
    </header>
    <main class="admin-main">
      <div class="stat-grid" id="rev-stats"></div>
      <div class="panel">
        <div class="panel-head"><h3>Breakdown by provider</h3></div>
        <table>
          <thead><tr><th>Provider</th><th>Gross Revenue</th><th>User Rewards</th><th>Provider Cost</th><th>Profit</th></tr></thead>
          <tbody id="by-provider"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Breakdown by task type</h3></div>
        <table>
          <thead><tr><th>Type</th><th>Gross Revenue</th><th>User Rewards</th><th>Profit</th></tr></thead>
          <tbody id="by-type"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script type="module" src="js/revenue.js"></script>
</body>
</html>
