<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnivo Admin — Add Task</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/toast.css">
<link rel="stylesheet" href="../css/components/ad-slot.css">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="admin-sidebar"></nav>
  <div>
    <header class="admin-topbar"><div><strong>Add Task</strong></div><a class="btn" href="tasks.html">← Back to Tasks</a></header>
    <main class="admin-main">
      <div class="panel">
        <div class="form-grid">
          <div class="form-field"><label>Task Name</label><input id="f-name"></div>
          <div class="form-field"><label>Task Type</label>
            <select id="f-type"><option>Task</option><option>Survey</option><option>Offer</option><option>Ad</option><option>App</option><option>Website</option><option>Game</option></select>
          </div>
          <div class="form-field"><label>Provider</label><input id="f-provider"></div>
          <div class="form-field"><label>Reward (₹)</label><input type="number" id="f-reward"></div>
          <div class="form-field"><label>Maximum Reward (₹)</label><input type="number" id="f-max-reward"></div>
          <div class="form-field"><label>User Limit</label><input type="number" id="f-user-limit"></div>
          <div class="form-field"><label>Daily Limit</label><input type="number" id="f-daily-limit"></div>
          <div class="form-field"><label>Country</label><input id="f-country" placeholder="e.g. IN, ALL"></div>
          <div class="form-field"><label>Device</label>
            <select id="f-device"><option>All</option><option>Mobile</option><option>Desktop</option></select>
          </div>
          <div class="form-field"><label>Start Date</label><input type="date" id="f-start-date"></div>
          <div class="form-field"><label>Expiry Date</label><input type="date" id="f-expiry-date"></div>
          <div class="form-field"><label>Start URL</label><input id="f-start-url"></div>
          <div class="form-field"><label>Icon URL</label><input id="f-icon-url"></div>

          <div class="form-field full"><label>Description</label><textarea id="f-description" rows="3" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface)"></textarea></div>
          <div class="form-field full"><label>Notes (internal)</label><textarea id="f-notes" rows="2" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface)"></textarea></div>
          <div class="form-field full"><label>Steps (one per line)</label><textarea id="f-steps" rows="3" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface)"></textarea></div>
          <div class="form-field full"><label>Proof Instructions</label><textarea id="f-proof-instructions" rows="2" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface)"></textarea></div>
          <div class="form-field"><label><input type="checkbox" id="f-requires-proof"> Requires proof submission</label></div>
          <div class="form-field"><label><input type="checkbox" id="f-active" checked> Active (uncheck to save hidden)</label></div>
        </div>
        <div class="form-actions">
          <button class="btn" id="save-draft-btn">Save Draft</button>
          <button class="btn btn-primary" id="create-task-btn">Create Task</button>
        </div>
      </div>
      <p id="form-status" style="font-size:.82rem;color:var(--text-muted)"></p>
    </main>
  </div>
</div>
<script type="module" src="js/add-task.js"></script>
</body>
</html>
