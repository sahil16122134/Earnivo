<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnivo Admin — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/toast.css">
<link rel="stylesheet" href="../css/components/ad-slot.css">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="admin-sidebar"></nav>
  <div>
    <header class="admin-topbar">
      <div><strong>Dashboard</strong></div>
      <div class="chip-row" id="range-chips">
        <button class="chip" data-r="today">Today</button>
        <button class="chip active" data-r="7d">7D</button>
        <button class="chip" data-r="30d">30D</button>
        <button class="chip" data-r="90d">90D</button>
      </div>
    </header>
    <main class="admin-main">
      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="l">Total users</div><div class="v skel" style="height:28px"></div></div>
        <div class="stat-card"><div class="l">Active today</div><div class="v skel" style="height:28px"></div></div>
        <div class="stat-card"><div class="l">Revenue (period)</div><div class="v skel" style="height:28px"></div></div>
        <div class="stat-card"><div class="l">User rewards (period)</div><div class="v skel" style="height:28px"></div></div>
        <div class="stat-card"><div class="l">Pending withdrawals</div><div class="v skel" style="height:28px"></div></div>
        <div class="stat-card"><div class="l">Profit (period)</div><div class="v skel" style="height:28px"></div></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Earning source breakdown</h3></div>
        <div id="source-breakdown" style="padding:var(--space-5)">
          <div class="skel" style="height:14px;margin-bottom:10px"></div>
          <div class="skel" style="height:14px;margin-bottom:10px"></div>
          <div class="skel" style="height:14px"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Recent activity</h3></div>
        <table>
          <thead><tr><th>Event</th><th>Actor</th><th>Detail</th><th>Time</th></tr></thead>
          <tbody id="activity-body"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
