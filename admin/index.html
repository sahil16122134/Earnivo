<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earnivo Admin — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/toast.css">
<link rel="stylesheet" href="../css/components/ad-slot.css">
<style>
  body{display:flex;align-items:center;justify-content:center}
  .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-6)}
  .login-card h1{font-size:1.2rem;margin-bottom:4px}
  .login-card p{font-size:.82rem;color:var(--text-muted);margin-bottom:var(--space-5)}
  .login-card .form-field{margin-bottom:var(--space-4)}
  .login-card input{width:100%}
  .login-card button{width:100%;padding:11px}
</style>
</head>
<body>
  <div class="login-card">
    <h1>Earnivo Admin</h1>
    <p>Sign in with your administrator account.</p>
    <div class="form-field">
      <label>Email</label>
      <input type="email" id="admin-email">
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" id="admin-password">
    </div>
    <p id="login-error" style="display:none;color:var(--accent-coral-ink);font-size:.8rem;margin-bottom:var(--space-3)"></p>
    <button class="btn btn-primary" id="login-btn">Sign in</button>
  </div>
<script type="module">
  import { auth } from "../js/services/firebase.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => { /* Stay on login until explicit sign-in. */ });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("admin-email").value.trim();
    const password = document.getElementById("admin-password").value;
    const errEl = document.getElementById("login-error");
    errEl.style.display = "none";
    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Admin role is verified server-side by the Worker on every privileged
      // call — signing in here only authenticates identity, not authorization.
      window.location.href = "dashboard.html";
    } catch (e) {
      errEl.textContent = "Sign-in failed. Check your credentials.";
      errEl.style.display = "block";
    }
  });
</script>
</body>
</html>
