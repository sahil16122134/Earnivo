name = "earnivo-worker"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# ── REQUIRED SECRETS (never put these in [vars] — they'd be readable in the
# repo/dashboard). Set each with `wrangler secret put <NAME>`, entering the
# value when prompted:
#
#   wrangler secret put FIREBASE_PROJECT_ID     # from Firebase Console → Project Settings
#   wrangler secret put FIREBASE_CLIENT_EMAIL   # from your Firebase service account JSON
#   wrangler secret put FIREBASE_PRIVATE_KEY    # from your Firebase service account JSON
#   wrangler secret put POSTBACK_SECRET         # any long random string you generate —
#                                                # shared with your task/survey/offer/ad
#                                                # providers to authenticate their postbacks
#
# Optional — set these once you integrate a real provider that supports its
# own callback secret, so a leaked secret for one provider can't be used to
# forge postbacks for the others. Any provider without its own secret set
# falls back to POSTBACK_SECRET above.
#   wrangler secret put ADSGRAM_SECRET
#   wrangler secret put SURVEY_SECRET
#   wrangler secret put OFFER_SECRET
#   wrangler secret put AD_PROVIDER_VERIFY_SECRET
#
# These are the secrets read by the current Worker code (src/*.js).
[vars]
# REQUIRED: your real GitHub Pages origin(s), comma-separated (no trailing
# slash). Example for a project site: "https://yourusername.github.io"
# Example for a custom domain: "https://earnivo.yourdomain.com"
# You may add a local dev origin too, e.g.:
#   "https://yourusername.github.io,http://localhost:5500"
ALLOWED_ORIGIN = "https://sahil16122134.github.io,https://earnivo.pages.dev"
ENVIRONMENT = "production"
# Set to "true" only after integrating a real server-side ad provider postback.
# Leaving this "false" disables the /watch-ad-reward endpoint so it cannot be
# farmed by direct API calls.
AD_PROVIDER_ENABLED = "false"
# Required before enabling rewarded-ad credits.
AD_PROVIDER_VERIFY_URL = ""

# Optional: rate limiting via Cloudflare's native binding (uncomment once
# configured in the dashboard).
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }


# Periodic maintenance retries failed referral credits and removes expired quota slots.
[triggers]
crons = ["*/15 * * * *"]

