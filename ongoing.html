<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnivo — Ongoing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/earn.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/components/modal.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/components/ad-slot.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-col">
    <div class="page-title">
      <h1>Ongoing</h1>
      <p><span id="active-count">0</span> active</p>
    </div>
    <div class="stack" style="gap:var(--space-3)">
      <div class="chip-row" id="status-chips"></div>
      <div id="ongoing-list" class="task-list">
        <div class="task-card skel" style="height:96px"></div>
      </div>
      <ad-slot placement="ongoing-below-list"></ad-slot>
    </div>
  </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script type="module" src="js/pages/ongoing.js"></script>
</body>
</html>
