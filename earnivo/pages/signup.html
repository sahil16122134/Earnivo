<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><link rel="icon" href="/assets/favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/main.css"/><link rel="stylesheet" href="/css/auth.css"/><title>Create account — Earnivo</title></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="/"><img src="/assets/logo.svg" alt=""/><span>Earnivo</span></a><section class="auth-card"><p class="eyebrow">Start your reward route</p><h1>Make every task count.</h1><p>Use one account to follow task terms, submissions, rewards, and withdrawals.</p><p id="referral-intent" class="configuration-callout" hidden></p><form id="auth-form" data-auth-mode="signup" novalidate><label>Email address<input name="email" type="email" autocomplete="email" required /></label><label>Create password<input name="password" type="password" autocomplete="new-password" minlength="6" required /></label><p class="field-note">Use at least six characters.</p><p class="form-error" hidden></p><button class="button button--primary button--block" type="submit">Create account <span>→</span></button></form><p class="auth-switch">Already have an account? <a href="/pages/login.html">Sign in</a></p></section></main><script type="module" src="/js/pages/auth-page.js"></script></body>
