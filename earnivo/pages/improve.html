<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><link rel="icon" href="/assets/favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/main.css"/><link rel="stylesheet" href="/css/profile.css"/><title>Help improve Earnivo</title></head>
<body><main class="app-shell"><div data-navbar></div><section class="page-heading"><div><p class="eyebrow">Product feedback</p><h1>Help improve the route.</h1><p>Share a clear, specific idea. The Earnivo team can review it from their workspace.</p></div></section><section class="profile-layout"><form id="feedback-form" class="profile-form" novalidate><label>Topic<select name="topic" required><option value="task">Task experience</option><option value="wallet">Wallet or withdrawal</option><option value="technical">Technical issue</option><option value="idea">Product idea</option></select></label><label>What would make this better?<textarea name="message" rows="7" minlength="12" required placeholder="Describe what happened or what you would change."></textarea></label><p class="form-error" hidden></p><button class="button button--primary" type="submit">Send feedback <span>→</span></button></form><aside class="profile-note"><h2>Useful feedback is specific.</h2><p>Include the page, the action you took, and what you expected to happen. Do not share passwords, payment details, or personal documents here.</p></aside></section></main><script type="module" src="/js/pages/feedback.js"></script></body>
</html>
