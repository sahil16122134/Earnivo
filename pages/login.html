<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><link rel="icon" href="/assets/favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/css/main.css"/><link rel="stylesheet" href="/css/auth.css"/><title>Sign in — Earnivo</title></head>
<body class="auth-page"><main class="auth-shell"><a class="brand" href="/"><img src="/assets/logo.svg" alt=""/><span>Earnivo</span></a><section class="auth-card"><p class="eyebrow">Your reward workspace</p><h1>Good to see you again.</h1><p>Sign in to keep track of your task progress and available balance.</p><form id="auth-form" data-auth-mode="login" novalidate><label>Email address<input name="email" type="email" autocomplete="email" required /></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required /></label><p class="form-error" hidden></p><button class="button button--primary button--block" type="submit">Sign in <span>→</span></button></form><button class="button button--secondary button--block" type="button" data-google-sign-in>Continue with Google</button><p class="auth-switch">New to Earnivo? <a href="/pages/signup.html">Create an account</a></p></section></main><script type="module" src="/js/pages/auth-page.js"></script></body>
