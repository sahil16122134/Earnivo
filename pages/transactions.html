<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnivo — Transactions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/toast.css">
<link rel="stylesheet" href="../css/components/ad-slot.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-col">
    <div class="back-row"><a href="../wallet.html" class="back-btn">←</a></div>
    <div class="page-title"><h1>Transactions</h1></div>

    <div class="stack" style="gap:var(--space-3)">
      <div class="chip-row" id="txn-chips"></div>
      <div class="field" style="margin-bottom:0">
        <input class="input" id="txn-search" placeholder="Search transaction ID, provider…" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:10px 16px">
      </div>
      <div class="card" id="txn-list">
        <div class="skel" style="height:44px;margin-bottom:10px"></div>
        <div class="skel" style="height:44px;margin-bottom:10px"></div>
        <div class="skel" style="height:44px"></div>
      </div>
      <ad-slot placement="transactions-below-list"></ad-slot>
    </div>
  </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script type="module" src="../js/pages/transactions.js"></script>
</body>
</html>
